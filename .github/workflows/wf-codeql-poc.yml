name: CodeQL SAST PoC Quarkus
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 3'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql:
    uses: DavidFaustino/ssdlc-codeql-poc/.github/workflows/codeql-reusable.yml@e44e1d97cd6ba43017233904e6c9b910a9e9cecd
    with:
      profile: java
      module_path: getting-started
      java_version: '17'
      query_suite: default
