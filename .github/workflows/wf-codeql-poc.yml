name: CodeQL SAST PoC Quarkus
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 3'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql:
    uses: DavidFaustino/ssdlc-codeql-poc/.github/workflows/codeql-reusable.yml@4487836e1b34ba737d33a395c3787cc1c6e1c680
    with:
      profile: java
      module_path: getting-started
      java_version: '17'
      query_suite: default
      policy_mode: warn
